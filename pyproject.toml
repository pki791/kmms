[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kmms"
version = "0.1.0"
description = "Kunas Modbus Master Simulator - cross-platform Modbus master with a modern GUI"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pymodbus>=3.11,<4",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[project.scripts]
kmms = "kmms.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
